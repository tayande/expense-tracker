{% extends "base.html" %}
{% block title %}Sign Up - Expense Tracker{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <h1>Create Account</h1>
    <form action="{{ url_for('signup') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password (min. 8 characters)" required minlength="8">
        <button type="submit">Sign Up</button>
    </form>
    <p class="switch-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
