{% extends "base.html" %}
{% block title %}Resend Verification Code - Expense Tracker{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <h1>Resend Code</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: -10px;">
        Enter the email you signed up with and we'll send a fresh verification code.
    </p>
    <form action="{{ url_for('resend_verification') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="email" name="email" placeholder="Email" required autofocus>
        <button type="submit">Resend Code</button>
    </form>
    <p class="switch-link"><a href="{{ url_for('login') }}">Back to log in</a></p>
</div>
{% endblock %}
