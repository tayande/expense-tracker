{% extends "base.html" %}
{% block title %}Reset Password - Prism{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <h1>Reset Password</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: -10px;">
        Enter the code we emailed you and choose a new password.
    </p>
    <form action="{{ url_for('reset_password') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="email" name="email" placeholder="Email" value="{{ prefill_email }}" required>
        <input type="text" name="code" placeholder="6-digit code" required maxlength="6" pattern="\d{6}">
        <input type="password" name="password" placeholder="New password (min. 8 characters)" required minlength="8">
        <button type="submit">Reset Password</button>
    </form>
    <p class="switch-link"><a href="{{ url_for('login') }}">Back to log in</a></p>
</div>
{% endblock %}
